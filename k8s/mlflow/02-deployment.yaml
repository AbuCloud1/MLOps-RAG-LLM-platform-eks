apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: rag
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      # mlflow never talks to the k8s api so skip the token
      automountServiceAccountToken: false
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.19.0
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            # sqlite for metadata pvc folder for artifacts good enough for one writer
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            # lets the server proxy artifact uploads so clients dont need pvc access
            - --artifacts-destination=/mlflow/artifacts
            # default worker count is way too heavy for this little pod
            - --workers=1
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: storage
              mountPath: /mlflow
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mlflow-storage
