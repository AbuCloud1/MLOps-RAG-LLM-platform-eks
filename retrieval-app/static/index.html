<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ask about Abubaker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --bubble-user: #2563eb;
    --bubble-user-text: #ffffff;
    --bubble-bot: #f0f0f2;
    --bubble-bot-text: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #212226;
      --text: #f0f0f0;
      --muted: #9a9a9a;
      --border: #35363b;
      --bubble-bot: #2c2d32;
      --bubble-bot-text: #f0f0f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header img {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  header .title { text-align: center; }
  header h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    font-size: 15px;
    color: var(--muted);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--bubble-bot-text);
    border-bottom-left-radius: 4px;
  }
  .sources {
    align-self: flex-start;
    font-size: 11px;
    color: var(--muted);
    margin-top: -6px;
    padding-left: 4px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: 2px solid var(--bubble-user); }
  button {
    padding: 0 20px;
    border-radius: 12px;
    border: none;
    background: var(--bubble-user);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="avatar.jpg" alt="Abubaker">
    <div class="title">
      <h1>Ask about Abubaker</h1>
      <p>RAG over personal notes &middot; Qdrant + vLLM on EKS</p>
    </div>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask a question..." autocomplete="off">
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
  const messages = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function addSources(sources) {
    if (!sources || !sources.length) return;
    const el = document.createElement('div');
    el.className = 'sources';
    el.textContent = 'Sources: ' + [...new Set(sources)].join(', ');
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    send.disabled = true;
    const thinking = addMessage('Thinking...', 'bot');

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      thinking.remove();

      if (data.error) {
        addMessage(data.error, 'bot');
      } else {
        addMessage(data.answer, 'bot');
        addSources(data.sources);
      }
    } catch (err) {
      thinking.remove();
      addMessage('Error reaching the assistant: ' + err.message, 'bot');
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  addMessage(
    "Hey, welcome! I'm Abubaker's assistant, ask me anything about him, " +
    "his work, hobbies, whatever. Also... I know a few funny stories and " +
    "secrets about him if you're up for some gossip. Try asking me " +
    "“tell me a funny story about Abubaker” or “do you have any secrets?”",
    'bot'
  );
  input.focus();
</script>
</body>
</html>
